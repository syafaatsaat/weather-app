<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <h1>How's the weather there?</h1>
  <div id="searchbar-div">
    <input type="text" id="searchbar" placeholder="Enter a location" />
    <button id="search-btn">Search</button>
  </div>
  <div id="weather-div">
    <h4 id="location">Location</h4>
    <div id="weather">
      <img src="./assets/clear-day.svg" alt="Weather Icon" id="icon">
      <h4 id="temp">28*C</h4>
    </div>
    <div class="info-row">
      <p class="label">Conditions</p>
      <p id="conditions">Rain</p>
    </div>
    <div class="info-row">
      <p class="label">Feels like</p>
      <p id="feels-like">33*C</p>
    </div>
    <div class="info-row">
      <p class="label">Humidity</p>
      <p id="humidity">67%</p>
    </div>
    <div class="info-row">
      <p class="label">Wind Speed</p>
      <p id="wind-speed">42.67%</p>
    </div>
  </div>
</body>
</html>

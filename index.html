<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather App</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"><script defer="defer" src="main.js"></script></head><body><div id="searchbar-div"><input id="searchbar" placeholder="Enter a location"/> <button id="search-btn">Search</button></div><div id="loading-div" class="display-div" hidden><h1>Gathering data...</h1></div><div id="weather-div" class="display-div" hidden><h4 id="location"></h4><div id="weather"><img src="27147402a8ebd22fc60d.svg" alt="Weather Icon" id="icon"><h4 id="temp"></h4></div><div class="info-row"><p class="label">Conditions</p><p id="conditions"></p></div><div class="info-row"><p class="label">Feels like</p><p id="feels-like"></p></div><div class="info-row"><p class="label">Humidity</p><p id="humidity"></p></div><div class="info-row"><p class="label">Wind speed</p><p id="wind-speed"></p></div></div></body></html>
